<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Diagram representing a large lookup table being recursively decomposed into an even tree of small 6-input LUT nodes">
  <rect width="480" height="300" fill="#fbe9dc"/>

  <g stroke="#a44e1f" stroke-width="1.8" fill="none">
    <rect x="170" y="16" width="140" height="40" rx="4"/>
  </g>
  <g fill="#8a6417" font-family="monospace" font-size="15" text-anchor="middle">
    <text x="240" y="41">L-LUT (N-input)</text>
  </g>

  <g stroke="#a44e1f" stroke-width="1.6" fill="none">
    <line x1="240" y1="56" x2="120" y2="96"/>
    <line x1="240" y1="56" x2="360" y2="96"/>
  </g>

  <g stroke="#a44e1f" stroke-width="1.6" fill="none">
    <rect x="60" y="96" width="120" height="36" rx="4"/>
    <rect x="300" y="96" width="120" height="36" rx="4"/>
  </g>
  <g fill="#8a6417" font-family="monospace" font-size="13" text-anchor="middle">
    <text x="120" y="118">split(x0)</text>
    <text x="360" y="118">split(x0)</text>
  </g>

  <g stroke="#a44e1f" stroke-width="1.4" fill="none">
    <line x1="120" y1="132" x2="60" y2="172"/>
    <line x1="120" y1="132" x2="180" y2="172"/>
    <line x1="360" y1="132" x2="300" y2="172"/>
    <line x1="360" y1="132" x2="420" y2="172"/>
  </g>

  <g fill="#c9622a">
    <rect x="30" y="172" width="60" height="34" rx="4"/>
    <rect x="150" y="172" width="60" height="34" rx="4"/>
    <rect x="270" y="172" width="60" height="34" rx="4"/>
    <rect x="390" y="172" width="60" height="34" rx="4"/>
  </g>
  <g fill="#fff9f4" font-family="monospace" font-size="12" text-anchor="middle">
    <text x="60" y="194">P-LUT</text>
    <text x="180" y="194">P-LUT</text>
    <text x="300" y="194">P-LUT</text>
    <text x="420" y="194">P-LUT</text>
  </g>

  <g fill="#8a6417" font-family="monospace" font-size="12" text-anchor="middle">
    <text x="60" y="222">6-input</text>
    <text x="180" y="222">6-input</text>
    <text x="300" y="222">6-input</text>
    <text x="420" y="222">6-input</text>
  </g>

  <g fill="#5c554e" font-family="monospace" font-size="12" text-anchor="middle">
    <text x="240" y="264">Shannon expansion, recursively applied</text>
    <text x="240" y="282">until every leaf fits a native FPGA LUT</text>
  </g>
</svg>

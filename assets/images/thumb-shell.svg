<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Diagram of a terminal window showing a shell prompt, a piped command, and a fork/exec process tree">
  <rect width="400" height="225" fill="#fbe9dc"/>

  <g stroke="#a44e1f" stroke-width="1.8" fill="#fff9f4">
    <rect x="40" y="35" width="320" height="155" rx="8"/>
  </g>
  <g fill="#a44e1f">
    <circle cx="58" cy="52" r="4"/>
    <circle cx="72" cy="52" r="4"/>
    <circle cx="86" cy="52" r="4"/>
  </g>
  <line x1="40" y1="64" x2="360" y2="64" stroke="#a44e1f" stroke-width="1.4"/>

  <g fill="#8a6417" font-family="monospace" font-size="13">
    <text x="56" y="86">[s3 ~]$ ls | grep .c</text>
  </g>

  <g stroke="#a44e1f" stroke-width="1.6" fill="none">
    <rect x="56" y="104" width="70" height="30" rx="4"/>
    <rect x="166" y="104" width="70" height="30" rx="4"/>
  </g>
  <g fill="#8a6417" font-family="monospace" font-size="11" text-anchor="middle">
    <text x="91" y="123">fork</text>
    <text x="201" y="123">exec</text>
  </g>
  <line x1="126" y1="119" x2="166" y2="119" stroke="#a44e1f" stroke-width="1.6"/>
  <path d="M156 112 L166 119 L156 126" fill="none" stroke="#a44e1f" stroke-width="1.6"/>

  <line x1="236" y1="119" x2="270" y2="119" stroke="#a44e1f" stroke-width="1.6"/>
  <path d="M260 112 L270 119 L260 126" fill="none" stroke="#a44e1f" stroke-width="1.6"/>
  <g fill="#a44e1f">
    <rect x="270" y="104" width="20" height="30" rx="3"/>
  </g>

  <g fill="#8a6417" font-family="monospace" font-size="12">
    <text x="56" y="164">[s3 ~]$ _</text>
  </g>
</svg>
